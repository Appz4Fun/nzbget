# Vale settings for the README and the documentation site.
#   vale README.md site/content
# The Google style is vendored in site/vale/styles from
# https://github.com/vale-cli/Google (v0.7.1, MIT).
StylesPath = site/vale/styles
MinAlertLevel = suggestion
Vocab = Docs

[*.md]
BasedOnStyles = Vale, Google
# Option names, crate names and release names aren't dictionary words.
# Vale.Terms (the accept list) still enforces the spelling of product names.
Vale.Spelling = NO
# A definition list item starts with ": " on its own line. That marker is
# markup, not a colon in a sentence, so Google.Colons must not see it.
TokenIgnores = (?m)^:[ ](?=\S)
