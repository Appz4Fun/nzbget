[package]
name = "nzbget-observe"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
debug = 1

