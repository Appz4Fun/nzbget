[package]
name = "nzbget-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false

[lib]
name = "nzbget_rs"
crate-type = ["staticlib", "rlib"]

[features]
# Untimed boundary coverage only; never enabled for native latency collection.
article-match-trace = []

[dependencies]
rust-par2 = { git = "https://github.com/TheDancingDeveloper-org/Rust-PAR2", rev = "dac531170ab6a8954d5a0c2cf8da6d4adce0a2bf" }
quick-xml = { version = "0.41", features = ["encoding"] }
md-5 = "0.11"

[dev-dependencies]
# Kernel diagnostics only; complete C++/Rust caller measurements remain the gate.
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "ports"
harness = false

[[bench]]
name = "criterion_ports"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = 1

[profile.dev]
panic = "abort"
