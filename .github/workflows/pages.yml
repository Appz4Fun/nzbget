# Builds the documentation site from site/ and deploys it to GitHub Pages.
# Runs on GitHub-hosted runners only when main (or the current default
# branch) receives a push, which includes every merged pull request, or when
# started by hand from the Actions tab.
name: docs

on:
  push:
    branches: [main, dupe-article-fallback]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/requirements.lock

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r site/requirements.lock

      - name: Install Vale
        run: |
          mkdir -p "$RUNNER_TEMP/vale"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/vale.tar.gz" \
            https://github.com/vale-cli/vale/releases/download/v3.24.0/vale_3.24.0_Linux_64-bit.tar.gz
          echo "867534ddb678abca7f214bc4706ead0922bd5252ffe8035fc227013f66c8b214  $RUNNER_TEMP/vale.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP/vale" vale
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"

      - name: Check prose (Google style)
        # bash -o pipefail: a Vale failure must not hide behind tee
        shell: bash
        run: |
          vale --version
          vale --minAlertLevel=warning --output=line README.md site/content | tee "$RUNNER_TEMP/vale.txt"
          if [ -s "$RUNNER_TEMP/vale.txt" ]; then
            echo "::error::Vale found prose problems. Fix them or explain the exception in .vale.ini."
            exit 1
          fi

      - name: Build the site
        run: python site/build.py --out "$RUNNER_TEMP/site"

      - name: Check links and pages
        run: python site/check.py "$RUNNER_TEMP/site"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
