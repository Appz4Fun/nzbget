# Benchmarks of a pull request, compared with the base branch's (bench_base.yml)
# by Bencher: the report is a comment on the pull request, and a port more than
# 10% slower is an alert that fails the check. Only pull requests into the
# base branch are benchmarked: it is the branch with a baseline. Pull requests
# from forks have no secrets and are skipped.
name: bench pull request

on:
  pull_request:
    branches: [dupe-article-fallback]
    types: [opened, reopened, edited, synchronize]

jobs:
  benchmark_pr_branch:
    name: Benchmark the pull request with Bencher
    if: >-
      ${{ vars.BENCHER_PROJECT != '' &&
      github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Rust toolchain (the version rust/rust-toolchain.toml pins)
        working-directory: rust
        run: |
          rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: bench-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: bench-${{ runner.os }}-

      - uses: bencherdev/bencher@main

      - name: Benchmark the pull request with Bencher
        env:
          BENCHER_KEY: ${{ secrets.BENCHER_API_KEY }}
          BENCHER_HOST_URL: ${{ vars.BENCHER_HOST }}
        run: |
          if [ -z "$BENCHER_KEY" ]; then
            echo "::notice::BENCHER_API_KEY is not set: benchmarks are not tracked"
            exit 0
          fi
          bencher run \
            ${BENCHER_HOST_URL:+--host "$BENCHER_HOST_URL"} \
            --project '${{ vars.BENCHER_PROJECT }}' \
            --key "$BENCHER_KEY" \
            --branch "$GITHUB_HEAD_REF" \
            --start-point "$GITHUB_BASE_REF" \
            --start-point-hash '${{ github.event.pull_request.base.sha }}' \
            --start-point-clone-thresholds \
            --start-point-reset \
            --testbed ubuntu-latest \
            --adapter json \
            --github-actions '${{ secrets.GITHUB_TOKEN }}' \
            --error-on-alert \
            "cd rust && cargo bench --bench ports"
