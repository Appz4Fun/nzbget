# Archive only from reviewed target-branch code, never a pull request checkout.
name: bench archive closed pull request

on:
  pull_request_target:
    branches: [dupe-article-fallback]
    types: [closed]

permissions:
  contents: read

# Publication and archival share a lock; publishers also check the PR is open.
concurrency:
  group: bench-publication-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  archive_pr_branch:
    name: Archive the closed pull request's branch with Bencher
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed target-branch tools
        uses: actions/checkout@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Diagnose archive configuration without exposing values
        id: config
        env:
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
          BENCHER_HOST_URL: ${{ vars.BENCHER_HOST }}
          BENCHER_KEY: ${{ secrets.BENCHER_API_KEY }}
          BENCH_GITHUB_TOKEN: ${{ secrets.BENCHMARK_GITHUB_TOKEN }}
        run: python3 scripts/bench/preflight.py --mode archive --github-output "$GITHUB_OUTPUT"

      - name: Verify the publication token's actual GitHub identity
        id: identity
        if: steps.config.outputs.ready == 'true'
        env:
          BENCH_GITHUB_TOKEN: ${{ secrets.BENCHMARK_GITHUB_TOKEN }}
        run: python3 scripts/bench/publish.py --verify-identity-only --github-output "$GITHUB_OUTPUT"

      - name: Install the pinned Bencher CLI
        if: steps.config.outputs.ready == 'true' && steps.identity.outputs.actor == 'xbmc4lyfe'
        uses: bencherdev/bencher@f80847436d7157936b40525db4c2a1064124f04a # v0.6.13
        with:
          version: 0.6.13

      - name: Archive the closed pull request's branch with Bencher
        if: steps.config.outputs.ready == 'true' && steps.identity.outputs.actor == 'xbmc4lyfe'
        env:
          BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
          BENCHER_HOST_URL: ${{ vars.BENCHER_HOST }}
          BENCHER_KEY: ${{ secrets.BENCHER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BENCH_GITHUB_TOKEN: ${{ secrets.BENCHMARK_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid pull request identity for archive."
            exit 1
          fi
          branch="pr-$PR_NUMBER"
          export BENCHER_API_KEY="$BENCHER_KEY"
          if [[ -n "$BENCHER_HOST_URL" ]]; then
            export BENCHER_HOST="$BENCHER_HOST_URL"
          fi
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          # An unpublished or already archived PR has no active branch. Do not
          # confuse lookup errors with absence, or expose raw API/CLI diagnostics.
          # Only the live GitHub guard below needs GitHub credentials.
          if ! env -u BENCH_GITHUB_TOKEN -u BENCHMARK_GITHUB_TOKEN -u GH_TOKEN -u GITHUB_TOKEN \
              bencher branch list "$BENCHER_PROJECT" --name "$branch" --per-page 2 \
              --attempts 2 --timeout 15 >"$scratch/branches.json" 2>"$scratch/error"; then
            echo "::error::Bencher branch lookup failed; no archive was attempted."
            exit 1
          fi
          if ! state=$(python3 - "$scratch/branches.json" "$branch" <<'PY'
          import json
          from pathlib import Path
          import sys
          try:
              path = Path(sys.argv[1])
              if path.stat().st_size > 1048576:
                  raise ValueError('oversized response')
              rows = json.loads(path.read_text())
              if not isinstance(rows, list) or len(rows) > 1:
                  raise ValueError('invalid branch list')
              if rows and (not isinstance(rows[0], dict) or rows[0].get('name') != sys.argv[2]):
                  raise ValueError('unexpected branch')
              print('present' if rows else 'absent')
          except (OSError, ValueError):
              sys.exit(1)
          PY
          ); then
            echo "::error::Bencher returned invalid or ambiguous branch data; no archive was attempted."
            exit 1
          fi
          if [[ "$state" == absent ]]; then
            echo "::notice::No active Bencher branch for this PR; no archive write is needed."
            exit 0
          fi
          # A delayed close event may now refer to a reopened PR. The shared
          # trusted helper verifies current PR scope/state and /user again,
          # immediately before this write; event metadata alone cannot permit it.
          if ! python3 scripts/bench/publish.py --verify-archive-only \
              --repository "$GITHUB_REPOSITORY" --pr-number "$PR_NUMBER" \
              --github-output "$scratch/guard" >"$scratch/guard.json" 2>"$scratch/error"; then
            echo "::error::Current PR state or token identity could not be verified; no archive was attempted."
            exit 1
          fi
          if grep -qx 'ready=false' "$scratch/guard" && grep -qx 'actor=xbmc4lyfe' "$scratch/guard"; then
            echo "::notice::The PR reopened; no archive write is needed."
            exit 0
          fi
          if ! grep -qx 'ready=true' "$scratch/guard" || ! grep -qx 'actor=xbmc4lyfe' "$scratch/guard"; then
            echo "::error::Archive guard did not authorize this operation."
            exit 1
          fi
          if ! env -u BENCH_GITHUB_TOKEN -u BENCHMARK_GITHUB_TOKEN -u GH_TOKEN -u GITHUB_TOKEN \
              bencher archive --project "$BENCHER_PROJECT" --branch "$branch" \
              --attempts 2 --timeout 15 >"$scratch/archive" 2>"$scratch/error"; then
            echo "::error::Bencher archive failed; branch lifecycle remains unresolved."
            exit 1
          fi
          echo "::notice::Archived this PR's Bencher branch."
